<!DOCTYPE html>
<html>
<head>
    <title>Debug Credentials</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div>
    <h1>Debug Credentials API</h1>
    <button onclick="debugRegenerateKey()">Test Regenerate</button>
    <div id="debug-output"></div>
</div>

<script>
function debugRegenerateKey() {
    console.log('=== INICIANDO DEBUG ===');
    
    if (confirm('Tem certeza que deseja regenerar sua chave API? A chave atual será invalidada.')) {
        console.log('=== USUÁRIO CONFIRMOU ===');
        
        fetch('/api/credentials/regenerate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => {
            console.log('=== RESPOSTA RECEBIDA ===');
            console.log('Response status:', response.status);
            console.log('Response ok:', response.ok);
            console.log('Response headers:', response.headers);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('=== DADOS PROCESSADOS ===');
            console.log('Response data:', data);
            console.log('Data type:', typeof data);
            console.log('Data success:', data.success);
            
            if (data.success) {
                console.log('=== SUCESSO DETECTADO ===');
                alert('Chave API regenerada com sucesso!');
                document.getElementById('debug-output').innerHTML = 'SUCCESS: ' + JSON.stringify(data);
            } else {
                console.log('=== ERRO NO DATA.SUCCESS ===');
                alert('Erro ao regenerar chave: ' + (data.error || 'Erro desconhecido'));
                document.getElementById('debug-output').innerHTML = 'ERROR: ' + JSON.stringify(data);
            }
        })
        .catch(error => {
            console.log('=== ERRO CAPTURADO ===');
            console.error('Erro completo:', error);
            console.error('Error name:', error.name);
            console.error('Error message:', error.message);
            console.error('Error stack:', error.stack);
            
            alert('Erro ao conectar com o servidor: ' + error.message);
            document.getElementById('debug-output').innerHTML = 'CATCH ERROR: ' + error.message;
        });
    } else {
        console.log('=== USUÁRIO CANCELOU ===');
    }
}
</script>
</body>
</html>
