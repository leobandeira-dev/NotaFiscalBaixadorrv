<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - XML Downloader</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-purple: #8A05BE;
            --primary-purple-dark: #6B0F9A;
            --primary-purple-light: #A855F7;
            --gray-50: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-900: #1A1A1A;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(135deg, rgba(138, 5, 190, 0.05) 0%, rgba(168, 85, 247, 0.05) 100%);
            border-radius: 0 0 0 200px;
            z-index: -1;
        }
        
        .auth-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-purple), var(--primary-purple-light));
        }
        
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .brand-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-purple-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: white;
            font-size: 1.5rem;
        }
        
        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }
        
        .brand-subtitle {
            color: #666;
            font-size: 1rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-control:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(138, 5, 190, 0.1);
            outline: none;
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            z-index: 10;
        }
        
        .form-control.with-icon {
            padding-left: 48px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-purple-dark));
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(138, 5, 190, 0.3);
        }
        
        .password-requirements {
            font-size: 0.875rem;
            color: #666;
            margin-top: 0.5rem;
        }
        
        .alert {
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border-left: 4px solid #10b981;
        }
        
        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border-left: 4px solid #ef4444;
        }
        
        .password-strength {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .password-strength.weak .password-strength-bar {
            width: 25%;
            background: #ef4444;
        }
        
        .password-strength.medium .password-strength-bar {
            width: 50%;
            background: #f59e0b;
        }
        
        .password-strength.good .password-strength-bar {
            width: 75%;
            background: #10b981;
        }
        
        .password-strength.strong .password-strength-bar {
            width: 100%;
            background: #059669;
        }
        
        @media (max-width: 768px) {
            .auth-container {
                padding: 1rem;
            }
            
            .auth-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-card">
                <div class="brand">
                    <div class="brand-logo">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1 class="brand-title">Nova Senha</h1>
                    <p class="brand-subtitle">Defina uma nova senha segura</p>
                </div>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST" id="resetForm">
                    <div class="input-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>Nova Senha
                        </label>
                        <div class="position-relative">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" 
                                   class="form-control with-icon" 
                                   id="password" 
                                   name="password" 
                                   placeholder="Digite sua nova senha"
                                   minlength="6"
                                   required>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="password-strength-bar"></div>
                        </div>
                        <div class="password-requirements">
                            Mínimo 6 caracteres. Use letras, números e símbolos para maior segurança.
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirm_password" class="form-label">
                            <i class="fas fa-check-circle me-2"></i>Confirmar Senha
                        </label>
                        <div class="position-relative">
                            <i class="fas fa-check-circle input-icon"></i>
                            <input type="password" 
                                   class="form-control with-icon" 
                                   id="confirm_password" 
                                   name="confirm_password" 
                                   placeholder="Confirme sua nova senha"
                                   minlength="6"
                                   required>
                        </div>
                        <div id="passwordMatch" class="password-requirements"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save me-2"></i>
                        Redefinir Senha
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            const checks = {
                length: password.length >= 8,
                lowercase: /[a-z]/.test(password),
                uppercase: /[A-Z]/.test(password),
                numbers: /\d/.test(password),
                symbols: /[^A-Za-z0-9]/.test(password)
            };
            
            strength = Object.values(checks).filter(Boolean).length;
            
            const strengthIndicator = document.getElementById('passwordStrength');
            strengthIndicator.className = 'password-strength';
            
            if (strength <= 2) {
                strengthIndicator.classList.add('weak');
            } else if (strength === 3) {
                strengthIndicator.classList.add('medium');
            } else if (strength === 4) {
                strengthIndicator.classList.add('good');
            } else {
                strengthIndicator.classList.add('strong');
            }
        }
        
        // Password match checker
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const matchIndicator = document.getElementById('passwordMatch');
            
            if (confirmPassword.length > 0) {
                if (password === confirmPassword) {
                    matchIndicator.textContent = '✓ Senhas coincidem';
                    matchIndicator.style.color = '#10b981';
                } else {
                    matchIndicator.textContent = '✗ Senhas não coincidem';
                    matchIndicator.style.color = '#ef4444';
                }
            } else {
                matchIndicator.textContent = '';
            }
        }
        
        // Event listeners
        document.getElementById('password').addEventListener('input', function() {
            checkPasswordStrength(this.value);
            checkPasswordMatch();
        });
        
        document.getElementById('confirm_password').addEventListener('input', checkPasswordMatch);
        
        // Form validation
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('As senhas não coincidem.');
                return;
            }
            
            if (password.length < 6) {
                e.preventDefault();
                alert('A senha deve ter pelo menos 6 caracteres.');
                return;
            }
        });
    </script>
</body>
</html>
